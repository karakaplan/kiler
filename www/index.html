<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Shelfetto</title>
<style>
/* VOICE: sakin, işe odaklı; telefonda tek elle kullanılan bir depo defteri
   IDEA: koli etiketi — kraft karton bant, siyah etiket yazısı
   PICTURE: uygulamanın kendisi; kart listesi ilk ekranda
   COLOUR and TYPE: kraft bant (değiştirilebilir), koyu gri zemin, antrasit kartlar, uyarı turuncu/kırmızı; sistem yazı tipi
   LAYOUT: sabit üst bant + arama/sırala/filtre + kategori çipleri, kartlar, sağ altta + */
:root{color-scheme:dark;--bg:#1f2022;--card:#303236;--ink:#eeeeec;--mute:#a3a5a8;--line:#3d3f44;--kraft:#c9a46a;--kraft2:#b48d52;--onk:#1b1a17;--warn:#ff8a4c;--bad:#ff6b6b;--ok:#86c97f;--seg:#eeeeec;--segoff:#4c4e54;--chip:#3a3c41}
*{box-sizing:border-box;min-width:0;-webkit-tap-highlight-color:transparent}
html{overflow-anchor:none}
body{margin:0;background:var(--bg);color:var(--ink);font:16px/1.45 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;overflow-x:clip}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--kraft2);outline-offset:2px}
header{position:sticky;top:0;z-index:5;background:var(--kraft);color:var(--onk);padding:max(12px,env(safe-area-inset-top)) 14px 10px;box-shadow:0 1px 0 rgba(0,0,0,.15)}
.top{display:flex;align-items:center;gap:8px}
.top h1{margin:0;font-size:26px;line-height:1.05;letter-spacing:-.01em}
.top .sum{font-size:13px;opacity:.8;margin-inline-start:2px}
.top .sp{flex:1}
.icon{width:44px;height:44px;border:0;border-radius:10px;background:rgba(0,0,0,.1);color:inherit;display:grid;place-items:center;position:relative;flex:none}
.icon svg{width:22px;height:22px}
.icon .dot{position:absolute;top:7px;right:7px;width:9px;height:9px;border-radius:50%;background:var(--bad);border:2px solid var(--kraft)}
.search{margin-top:10px;display:flex;gap:8px}
.search input{flex:1;height:44px;border:0;border-radius:10px;padding:0 12px;background:rgba(255,255,255,.8);color:#1b1a17;font-size:16px}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 14px;scrollbar-width:none;background:var(--bg);position:sticky;top:var(--hh,118px);z-index:4;border-bottom:1px solid var(--line)}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;height:36px;padding:0 14px;border-radius:18px;border:1px solid var(--line);background:var(--chip);font-size:14px;white-space:nowrap}
.chips button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.chips .alert b{display:inline-block;min-width:20px;padding:0 6px;margin-inline-start:6px;border-radius:10px;background:var(--warn);color:#fff;font-size:12px;line-height:20px;text-align:center}
main{padding:10px 12px 110px;max-width:1100px;margin:0 auto}
.info{font-size:13px;color:var(--mute);margin:2px 4px 10px;display:flex;justify-content:space-between;gap:8px}
.info button{border:0;background:none;color:var(--kraft2);font-size:13px;font-weight:600;padding:0}
/* kartlar */
.cards{display:grid;gap:10px;grid-template-columns:repeat(auto-fill,minmax(min(100%,340px),1fr))}
.card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:14px 14px 12px 16px;display:flex;gap:10px;align-items:center;user-select:none;-webkit-user-select:none;position:relative}
.card.sel{border-color:var(--kraft2);box-shadow:0 0 0 2px var(--kraft2) inset}
.card .body{flex:1;cursor:pointer}
.card .nm{font-size:17px;font-weight:650;line-height:1.25}
.card .sub{font-size:13px;color:var(--mute);margin-top:2px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.card .tags{display:flex;flex-wrap:wrap;gap:6px;margin-top:8px}
.card .tags:empty{display:none}
.tag{font-size:12px;line-height:1;padding:6px 9px;border-radius:8px;background:var(--chip);color:var(--mute);white-space:nowrap}
.tag.soon{background:var(--warn);color:#fff}.tag.bad{background:var(--bad);color:#fff}.tag.ok{background:color-mix(in srgb,var(--ok) 18%,var(--card));color:var(--ok)}
.selc{width:24px;height:24px;border-radius:50%;border:2px solid var(--line);flex:none;display:grid;place-items:center}
.card.sel .selc{background:var(--kraft2);border-color:var(--kraft2)}
.card.sel .selc::after{content:'';width:10px;height:6px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.qty{display:flex;align-items:center;gap:8px;flex:none}
.qty button{width:22px;height:22px;border-radius:50%;border:1.5px solid var(--mute);background:none;color:var(--mute);font-size:14px;line-height:1;display:grid;place-items:center;padding:0;position:relative}
.qty button::after{content:'';position:absolute;inset:-10px}
.qty button:disabled{opacity:.3}
.qty span{min-width:26px;text-align:center;font-size:15px;font-weight:650;font-variant-numeric:tabular-nums}
.fill{flex:none;display:flex;gap:2px;align-items:flex-end;border:0;background:none;padding:10px 4px;height:44px}
.fill i{width:6px;border-radius:2px;background:var(--segoff)}
.fill i:nth-child(1){height:9px}.fill i:nth-child(2){height:13px}.fill i:nth-child(3){height:17px}.fill i:nth-child(4){height:21px}
.fill i.on{background:var(--seg)}
.fill.low i.on{background:var(--warn)}
.fill.zero i{background:none;outline:1.5px solid var(--bad);outline-offset:-1.5px}
.card .fill{padding:10px 6px;height:52px}
.card .fill i{width:8px}.card .fill i:nth-child(1){height:11px}.card .fill i:nth-child(2){height:16px}.card .fill i:nth-child(3){height:21px}.card .fill i:nth-child(4){height:26px}
.empty{padding:40px 16px;text-align:center;color:var(--mute)}
/* tablo */
.tw{overflow-x:auto;background:var(--card);border:1px solid var(--line);border-radius:12px}
table{border-collapse:collapse;table-layout:fixed;width:100%;min-width:640px;font-size:14px}
th,td{padding:8px 10px;border-bottom:1px solid var(--line);text-align:start;white-space:nowrap;vertical-align:middle;overflow:hidden;text-overflow:ellipsis}
th{padding:0;position:sticky;top:0;background:var(--card)}
td:first-child,th:first-child{position:sticky;left:0;background:var(--card);z-index:1;white-space:normal;font-weight:600;box-shadow:1px 0 0 var(--line)}
td:not(:first-child){font-size:13px;color:var(--mute)}
td.no{font-style:italic}
td.f{padding:0 4px}
tbody tr{cursor:pointer}
tr.sel td{background:color-mix(in srgb,var(--kraft) 16%,var(--card))}
.th{border:0;background:none;width:100%;text-align:start;padding:10px;font-size:11px;font-weight:600;color:var(--mute);white-space:nowrap;display:flex;gap:4px;align-items:center;min-height:40px}
.th.on{color:var(--ink)}.th span{font-size:9px}
.thw{display:flex;align-items:center;padding-inline-start:10px}.thw .th{padding-inline-start:0}
.ck{width:15px;height:15px;margin:0;accent-color:var(--kraft2);vertical-align:middle;cursor:pointer}
.ckw{display:inline-flex;align-items:center;padding:10px 8px 10px 2px;margin:-10px 0;cursor:pointer;vertical-align:middle}
.dt{font-size:12px;padding:2px 7px;border-radius:6px;background:var(--chip);color:var(--mute);white-space:nowrap}
.dt.soon{background:var(--warn);color:#fff}.dt.past{background:var(--bad);color:#fff}.dt+.dt{margin-inline-start:4px}
/* genel */
.fab{position:fixed;right:18px;bottom:calc(22px + env(safe-area-inset-bottom));width:58px;height:58px;border-radius:16px;border:0;background:var(--ink);color:var(--bg);font-size:30px;line-height:1;box-shadow:0 6px 18px rgba(0,0,0,.25);z-index:6}
body.selecting .fab{display:none}
.ov{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:20;display:none;align-items:flex-end;justify-content:center}
.ov.open{display:flex}
.sheet{background:var(--card);width:100%;max-width:560px;max-height:92vh;overflow:auto;border-radius:18px 18px 0 0;padding:16px 16px calc(22px + env(safe-area-inset-bottom));animation:up .18s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}}
@media(prefers-reduced-motion:reduce){.sheet{animation:none}}
.sheet h2{margin:0 0 12px;font-size:20px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.x{border:0;background:var(--chip);width:40px;height:40px;border-radius:10px;font-size:20px;flex:none}
.f{display:grid;gap:12px}
.f label,.lbl{display:grid;gap:4px;font-size:13px;color:var(--mute)}
.f input,.f select,.f textarea,.inp{height:46px;border:1px solid var(--line);border-radius:10px;padding:0 12px;background:var(--bg);font-size:16px;color:var(--ink);width:100%}
.f textarea{height:80px;padding:10px 12px;resize:vertical}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:10px}
.step{display:flex;gap:6px}.step input{flex:1;text-align:center}
.step button{width:46px;height:46px;border-radius:10px;border:1px solid var(--line);background:var(--chip);font-size:20px;flex:none}
.seg{display:grid;grid-template-columns:repeat(auto-fit,minmax(0,1fr));gap:4px}
.seg button{height:44px;border-radius:10px;border:1px solid var(--line);background:var(--bg);font-size:14px;padding:0 4px}
.seg button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.acts{display:flex;gap:8px;margin-top:6px}
.btn{height:48px;border-radius:12px;border:1px solid var(--line);background:var(--chip);padding:0 16px;font-weight:600}
.btn.pri{background:var(--ink);color:var(--bg);border-color:var(--ink);flex:1}
.btn.del{color:var(--bad)}
.btn.del.sure{background:var(--bad);color:#fff;border-color:var(--bad)}
.big{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:6px}
.big button{height:64px;border-radius:12px;border:1px solid var(--line);background:var(--bg);font-size:16px;font-weight:600}
.big button.on{background:var(--ink);color:var(--bg)}
.opts{display:flex;gap:6px;flex-wrap:wrap}
.opts button{min-height:38px;padding:0 12px;border-radius:19px;border:1px solid var(--line);background:var(--bg);font-size:14px}
.opts button.on{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.opts.chk button.on::before{content:'✓ '}
.rad{display:grid;gap:4px}
.rad button{display:flex;justify-content:space-between;align-items:center;height:48px;border:0;border-radius:10px;background:none;padding:0 12px;text-align:start;font-size:16px}
.rad button.on{background:var(--chip);font-weight:650}
.rad button span{font-size:13px;color:var(--mute)}
.hid{display:none!important}
/* kaydırınca küçülen üst bölüm */
header,.top h1,.top .sum,.icon,.icon svg,.search,.search input,.chips,.chips button{transition:all .22s ease}
body.compact header{padding-top:max(6px,env(safe-area-inset-top));padding-bottom:6px}
body.compact .top h1{font-size:18px}
body.compact .top .sum{font-size:11px}
body.compact .icon{width:32px;height:32px;border-radius:8px}
body.compact .icon svg{width:17px;height:17px}
body.compact .icon .dot{top:4px;right:4px;width:7px;height:7px}
body.compact .search{margin-top:6px}
body.compact .search input{height:32px;font-size:14px;border-radius:8px}
body.compact .chips{padding:6px 14px}
body.compact .chips button{height:26px;font-size:12px;padding:0 10px}
body.compact .chips .alert b{min-width:16px;line-height:16px;font-size:10px}
@media(prefers-reduced-motion:reduce){header,.top h1,.top .sum,.icon,.icon svg,.search,.search input,.chips,.chips button{transition:none}}
.tag.lb{background:none;border:1px solid var(--line);color:var(--ink)}
.tagrow{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.tagrow .tg{display:inline-flex;align-items:center;gap:2px;height:34px;padding:0 4px 0 12px;border-radius:8px;background:var(--chip);color:var(--ink);font-size:14px}
.tagrow .tg button{border:0;background:none;width:28px;height:28px;color:var(--mute);font-size:16px}
.tagrow .addt{height:34px;border-radius:8px;border:1px dashed var(--mute);background:none;color:var(--mute);padding:0 12px;font-size:14px}
.pick{border:1px solid var(--line);border-radius:12px;padding:8px;background:var(--bg)}
.pick input{border:0!important;background:none!important;height:44px}
.pl{display:grid;max-height:260px;overflow:auto}
.pl button{display:flex;align-items:center;gap:12px;height:46px;border:0;background:none;text-align:start;padding:0 8px;font-size:16px;color:var(--ink)}
.pl button .bx{width:20px;height:20px;border:2px solid var(--mute);border-radius:4px;margin-inline-start:auto;flex:none;display:grid;place-items:center}
.pl button.on .bx{background:var(--kraft2);border-color:var(--kraft2)}
.pl button.on .bx::after{content:'';width:9px;height:5px;border:2.5px solid #fff;border-top:0;border-right:0;transform:rotate(-45deg) translate(1px,-1px)}
.pl svg{width:20px;height:20px;flex:none;color:var(--mute)}
.menu{display:grid;gap:14px}
.menu section{border-top:1px solid var(--line);padding-top:12px}
.menu h3{margin:0 0 6px;font-size:15px}
.menu p{margin:0 0 8px;font-size:13px;color:var(--mute)}
.line{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.menu input[type=number]{width:80px;height:44px;border:1px solid var(--line);border-radius:10px;text-align:center;background:var(--bg)}
.swc{width:40px;height:40px;border-radius:50%;border:1px solid rgba(0,0,0,.15);padding:0;cursor:pointer}
.swc.cust{position:relative;overflow:hidden;background:conic-gradient(red,yellow,lime,cyan,blue,magenta,red);display:inline-block}
.swc.cust input{position:absolute;inset:0;opacity:0;width:100%;height:100%;cursor:pointer}
.catl{display:flex;flex-wrap:wrap;gap:6px}
.catl span{display:inline-flex;align-items:center;gap:2px;border:1px solid var(--line);border-radius:16px;padding:0 4px 0 12px;height:34px;font-size:14px}
.catl button{border:0;background:none;width:28px;height:28px;border-radius:50%;color:var(--mute);font-size:16px}
.filebtn{position:relative;overflow:hidden;display:inline-flex;align-items:center}
.filebtn input{position:absolute;inset:0;opacity:0;cursor:pointer}
.bulk{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(18px + env(safe-area-inset-bottom));background:var(--ink);color:var(--bg);border-radius:14px;padding:8px 8px 8px 16px;display:none;gap:8px;align-items:center;z-index:7;box-shadow:0 6px 18px rgba(0,0,0,.3);max-width:94vw;white-space:nowrap}
.bulk.show{display:flex}
.bulk button{height:42px;border-radius:10px;border:0;padding:0 14px;font-weight:600;background:var(--bg);color:var(--ink)}
.bulk .bx{background:none;color:var(--bg);font-size:20px;padding:0 10px}
.toast{position:fixed;left:50%;bottom:calc(92px + env(safe-area-inset-bottom));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:10px 14px;border-radius:12px;display:none;gap:12px;align-items:center;z-index:30;font-size:14px;max-width:92vw}
.toast.show{display:flex}
.toast button{border:0;background:none;color:var(--kraft);font-weight:700;padding:6px}
</style>
</head>
<body>
<header id="hd">
  <div class="top">
    <h1 id="appName">Shelfetto</h1><span class="sum" id="sum"></span><span class="sp"></span>
    <button class="icon" id="modeBtn" aria-label="Görünümü değiştir"></button>
    <button class="icon" id="menuBtn" aria-label="Menü"><svg viewBox="0 0 24 24" fill="currentColor"><circle cx="5" cy="12" r="2"/><circle cx="12" cy="12" r="2"/><circle cx="19" cy="12" r="2"/></svg></button>
  </div>
  <div class="search">
    <input id="q" type="search" placeholder="Ara: ürün, marka, konum, not…" autocomplete="off">
    <button class="icon" id="sortBtn" aria-label="Sırala"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M7 4v16M3 8l4-4 4 4M17 20V4M13 16l4 4 4-4"/></svg></button>
    <button class="icon" id="filterBtn" aria-label="Filtrele"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linejoin="round"><path d="M3 5h18l-7 8v6l-4-2v-4z"/></svg></button>
  </div>
</header>
<nav class="chips" id="chips"></nav>
<main id="list"></main>
<button class="fab" id="add" aria-label="Ürün ekle">+</button>

<div class="ov" id="ov"><div class="sheet" id="sheet" role="dialog" aria-modal="true"></div></div>
<div class="bulk" id="bulk"><span id="bcount"></span><button id="bedit">Toplu düzenle</button><button id="bdel">Sil</button><button class="bx" id="bclr" aria-label="Seçimi kaldır">×</button></div>
<div class="toast" id="toast"><span id="tmsg"></span><button id="tbtn">Geri al</button></div>

<script>
{
const KEY='depo-v1';
const Cap=window.Capacitor,isNative=!!(Cap&&Cap.isNativePlatform&&Cap.isNativePlatform());
const P=isNative?Cap.Plugins:{};
const LN=P.LocalNotifications,PR=P.Preferences,FS=P.Filesystem,APP=P.App;
const $=s=>document.querySelector(s);
const esc=s=>String(s??'').replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const uid=()=>Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const pad=n=>String(n).padStart(2,'0');
const ymd=d=>d.getFullYear()+'-'+pad(d.getMonth()+1)+'-'+pad(d.getDate());
const today=()=>{const d=new Date();d.setHours(0,0,0,0);return d};
const plus=n=>{const d=today();d.setDate(d.getDate()+n);return ymd(d)};
const days=s=>Math.round((new Date(s+'T00:00:00')-today())/864e5);
const trDate=s=>{const [y,m,d]=s.split('-');return d+'.'+m+'.'+y};
const cmpTr=(a,b)=>String(a).localeCompare(String(b),'tr');

const NOTES={"Gsf Gentle Snow Foam":"Ön yıkama köpüğü","Green Star":"Çok amaçlı temizleyici","Glas Star":"Cam temizleyici","Pol Star":"Döşeme/deri temizleyici","Ceramic Polish All-in-One":"Seramik cila","Ceramic QuickDetailer":"Hızlı detaylandırıcı","FelgenBeast":"Jant temizleyici","Interior Cleaner":"İç mekan temizleyici","Insektenreiniger":"Böcek lekesi temizleyici","Felgenreiniger":"Jant temizleyici","Teerentferner":"Katran sökücü","Polsterschaum":"Döşeme köpüğü","Glasreiniger":"Cam temizleyici","Hauptreiniger":"Ana temizleyici","Lavanta yağı":"Esans yağı","Sandal ağacı yağı":"Esans yağı","Ylang-Ylang yağı":"Esans yağı","Paçuli yağı":"Esans yağı","Tarçın parfüm yağı":"Parfüm yağı"};
const TYPES=['Sarf','Ekipman','Yedek parça'];
const KWCAT={'Yıkama':'Araç yıkama','Jant':'Araç yıkama','Cam':'Araç yıkama','İç temizlik':'İç temizlik','Boya koruma':'Cila / koruma','Araç kokusu':'Araç kokusu'};
function kw(it){if(it.section==='Gıda')return'Beslenme';if(it.section==='Tamir/yedek')return'Tamirat';
  if(it.section==='Araç bakım'){if(it.cat==='Ekipman')return/polisaj/i.test(it.name)?'Cila / koruma':'Araç yıkama';return KWCAT[it.cat]||''}return''}

let S,hadLocal=false;
function seed(){
  const car=[
['Gsf Gentle Snow Foam','Koch Chemie','Yıkama','S'],['Green Star','Koch Chemie','Yıkama','S'],['Glas Star','Koch Chemie','Cam','S'],['Pol Star','Koch Chemie','İç temizlik','S'],
['Ceramic Polish All-in-One','SONAX','Boya koruma','S'],['Ceramic QuickDetailer','SONAX','Boya koruma','S'],['FelgenBeast','SONAX','Jant','S',1,'5 L'],['Interior Cleaner','Nanolex','İç temizlik','S'],
['Insektenreiniger','Mellerud','Yıkama','S'],['Felgenreiniger','Parkside','Jant','S'],['Teerentferner','Liqui Moly','Yıkama','S'],['Polsterschaum','W5','İç temizlik','S'],
['Glasreiniger','W5','Cam','S'],['Hauptreiniger','Sapur','İç temizlik','S'],['Lavanta yağı','','Araç kokusu','S'],['Sandal ağacı yağı','','Araç kokusu','S'],
['Ylang-Ylang yağı','','Araç kokusu','S'],['Paçuli yağı','','Araç kokusu','S'],['Tarçın parfüm yağı','Profissimo (dm)','Araç kokusu','S'],
['Yıkama eldiveni','','Ekipman','E',1],['Kova','','Ekipman','E',1],['Fırça','','Ekipman','E',1],['Mikrofiber bezler','','Ekipman','E',0],['Kurulama bezi','','Ekipman','E',1],

function migrate(d){
  if(!d.types)d.types=[...TYPES];if(!d.sections)d.sections=['Araç bakım','Gıda','Tamir/yedek'];
  d.items.forEach((it,i)=>{
    if(it.amount==null)it.amount='';if(!it.type)it.type=it.fill==null?'Ekipman':'Sarf';if(it.war==null)it.war='';if(it.note==null)it.note='';
    if(it.name==='FelgenBeast 5 L'){it.name='FelgenBeast';it.amount='5 L'}
    if(!d.notesV&&!it.note&&it.section==='Araç bakım'&&NOTES[it.name])it.note=NOTES[it.name];
    if(!(d.v>=4)){if(it.usage==null)it.usage='';if(it.usage&&it.usage===NOTES[it.name]){if(!it.note)it.note=it.usage;it.usage=''}if(!it.usage)it.usage=kw(it)}
    if(!(d.v>=5)){if(it.usage&&!(it.note||'').includes(it.usage))it.note=[it.usage,it.note].filter(Boolean).join(' · ');delete it.usage}
    if(it.added==null)it.added=i;if(!Array.isArray(it.tags))it.tags=[];
    if(!d.sections.includes(it.section))d.sections.push(it.section);
  });
  if(!d.backup)d.backup={freq:'weekly',last:''};if(!d.tags)d.tags=[];if(d.appName==='Kiler')d.appName='';
  d.v=5;d.notesV=1;return d;
}

let ntT;
function scheduleNotes(){if(!LN)return;clearTimeout(ntT);ntT=setTimeout(async()=>{try{
  const p=await LN.getPending();if(p.notifications&&p.notifications.length)await LN.cancel({notifications:p.notifications.map(n=>({id:n.id}))});
  const now=new Date(),L=[];let id=1;
  const at=(d0,off)=>{const d=new Date(d0+'T09:00:00');d.setDate(d.getDate()-off);return d};
  const add=(d,title,body)=>{if(d>now)L.push({id:id++,title,body,schedule:{at:d,allowWhileIdle:true}})};
  S.items.forEach(it=>{
    if(it.exp){add(at(it.exp,S.warn),it.name,`Son kullanma tarihine ${S.warn} gün kaldı (${trDate(it.exp)})`);add(at(it.exp,0),it.name,`Son kullanma tarihi bugün (${trDate(it.exp)})`)}
    if(it.war){add(at(it.war,wwarn()),it.name,`Garantinin bitmesine ${wwarn()} gün kaldı (${trDate(it.war)})`)}});
  L.sort((a,b)=>a.schedule.at-b.schedule.at);
  if(L.length)await LN.schedule({notifications:L.slice(0,60)});
}catch(e){console.log('bildirim',e)}},800)}

function sortVal(it,k){return k==='fill'?it.fill:k==='exp'?(it.exp||it.war||''):k==='added'?it.added:(it[k]||'')}
function cmp(a,b){const va=sortVal(a,sortK),vb=sortVal(b,sortK);const ea=va===''||va==null,eb=vb===''||vb==null;
  if(ea||eb){if(ea!==eb)return ea?1:-1}else{const r=(typeof va==='number'?va-vb:cmpTr(va,vb));if(r)return sortD*r}return cmpTr(a.name,b.name)}

function tagsHtml(it){

  if(it.war){const d=days(it.war);t.push(d<0?['','Garanti bitti']:d<=wwarn()?['soon','Garanti '+d+' gün']:['','Garanti '+trDate(it.war)])}
  if(it.fill===0)t.push(['bad','Bitti']);else if(it.fill!=null&&it.fill<=25)t.push(['soon','Az kaldı']);
  if(it.fill==null&&it.qty===0)t.push(['bad','Stok yok']);

function lum(h){const n=parseInt(h.slice(1),16),r=(n>>16&255)/255,g=(n>>8&255)/255,b=(n&255)/255;const f=c=>c<=.03928?c/12.92:((c+.055)/1.055)**2.4;return .2126*f(r)+.7152*f(g)+.0722*f(b)}

/* CSV */
const COLS=[['name','Ürün'],['brand','Marka'],['section','Kategori'],['loc','Konum'],['qty','Adet'],['amount','Miktar'],['fill','Doluluk'],['exp','Son Kullanma'],['war','Garanti'],['tags','Etiketler'],['note','Not']];
function toCSV(){const c=v=>{v=v==null?'':String(v);return/[;"\n\r]/.test(v)?'"'+v.replace(/"/g,'""')+'"':v};
  return'﻿'+[COLS.map(x=>x[1]).join(';'),...S.items.map(it=>COLS.map(([k])=>c(k==='tags'?(it.tags||[]).join(', '):it[k])).join(';'))].join('\r\n')}
function parseCSV(txt){
  txt=txt.replace(/^﻿/,'');const first=txt.split('\n')[0],sep=(first.match(/;/g)||[]).length>=(first.match(/,/g)||[]).length?';':',';
  const rows=[];let r=[],c='',qd=false;
  for(let i=0;i<txt.length;i++){const ch=txt[i];
    if(qd){if(ch==='"'){if(txt[i+1]==='"'){c+='"';i++}else qd=false}else c+=ch}
    else if(ch==='"')qd=true;else if(ch===sep){r.push(c);c=''}
    else if(ch==='\n'){r.push(c);rows.push(r);r=[];c=''}else if(ch!=='\r')c+=ch}
  if(c||r.length){r.push(c);rows.push(r)}
  return rows.filter(x=>x.some(v=>v.trim()));
}
function csvItems(txt){
  const rows=parseCSV(txt);if(rows.length<2)return[];
  const h=rows.shift().map(x=>x.trim().toLocaleLowerCase('tr'));
  const col=(...ns)=>h.findIndex(x=>ns.some(n=>x.startsWith(n)));
  const ix={n:col('ürün','urun','name'),b:col('marka'),s:col('kategori','bölüm'),l:col('konum'),q:col('adet'),a:col('miktar','menge'),f:col('doluluk'),e:col('son'),w:col('garanti'),o:col('not'),u:col('kullan'),t:col('tür'),g:col('etiket')};
  const dt=v=>{v=(v||'').trim();const m=v.match(/^(\d{1,2})\.(\d{1,2})\.(\d{4})$/);return m?`${m[3]}-${pad(m[2])}-${pad(m[1])}`:/^\d{4}-\d{2}-\d{2}$/.test(v)?v:''};
  const now=Date.now();
  return rows.map((r,i)=>{const g=k=>ix[k]<0?'':(r[ix[k]]||'').trim();if(!g('n'))return null;
    const eq=/ekipman/i.test(g('t'));let qty=g('q'),amount=g('a');
    if(ix.q<0&&/^\d+$/.test(amount)){qty=amount;amount=''}
    let fill;if(ix.f>=0){const v=g('f');fill=v===''?null:Math.min(100,Math.max(0,Math.round(parseFloat(v)/25)*25))}else fill=eq?null:100;
    if(Number.isNaN(fill))fill=null;
    return{id:uid(),name:g('n'),brand:g('b'),section:g('s')||(view!=='Tümü'&&view!=='__alert'?view:S.sections[0]),loc:g('l'),qty:/^\d+$/.test(qty)?+qty:null,amount,fill,
      exp:dt(g('e')),war:dt(g('w')),note:[g('u'),g('o')].filter(Boolean).join(' · '),cat:'',type:eq?'Ekipman':'Sarf',tags:g('g')?g('g').split(',').map(x=>x.trim()).filter(Boolean):[],added:now+i}}).filter(Boolean);
}
async function writeFile(name,data){
  try{await FS.writeFile({path:'Download/Shelfetto/'+name,data,directory:'EXTERNAL_STORAGE',encoding:'utf8',recursive:true});return'İndirilenler › Shelfetto'}
  catch(e){await FS.writeFile({path:'Shelfetto/'+name,data,directory:'DOCUMENTS',encoding:'utf8',recursive:true});return'Belgeler › Shelfetto'}
}
const stamp=()=>{const d=new Date();return ymd(d)+'_'+pad(d.getHours())+pad(d.getMinutes())};
async function backupNow(auto){
  const name=(auto?'shelfetto-otomatik-':'shelfetto-yedek-')+stamp()+'.csv';
  const where=await writeFile(name,toCSV());
  S.backup.last=new Date().toISOString();S.backup.where=where;store();
  if(auto)pruneAuto();
  return where+' › '+name;
}
async function pruneAuto(){try{const r=await FS.readdir({path:'Download/Shelfetto',directory:'EXTERNAL_STORAGE'});
  const n=(r.files||[]).map(f=>typeof f==='string'?f:f.name).filter(x=>x.startsWith('shelfetto-otomatik-')).sort();
  for(const x of n.slice(0,Math.max(0,n.length-6)))await FS.deleteFile({path:'Download/Shelfetto/'+x,directory:'EXTERNAL_STORAGE'})}catch(e){}}
async function autoBackup(){if(!FS)return;const per={daily:1,weekly:7,monthly:30}[S.backup.freq];if(!per)return;
  const last=S.backup.last?new Date(S.backup.last):null;if(last&&(Date.now()-last)/864e5<per-0.02)return;
  try{await backupNow(true)}catch(e){console.log('yedek',e)}}

let lpT=null,lpFired=false,lpXY=null;
const list=$('#list');
list.addEventListener('pointerdown',e=>{const c=e.target.closest('.card');if(!c||e.target.closest('.qty,.fill'))return;lpFired=false;lpXY=[e.clientX,e.clientY];
  clearTimeout(lpT);lpT=setTimeout(()=>{lpFired=true;sel.add(c.dataset.id);if(navigator.vibrate)navigator.vibrate(20);render()},500)});
list.addEventListener('pointermove',e=>{if(lpXY&&Math.hypot(e.clientX-lpXY[0],e.clientY-lpXY[1])>10)clearTimeout(lpT)});
['pointerup','pointercancel','pointerleave'].forEach(t=>list.addEventListener(t,()=>clearTimeout(lpT)));
list.addEventListener('contextmenu',e=>{if(e.target.closest('.card'))e.preventDefault()});
list.addEventListener('change',e=>{const c=e.target;if(!c.classList.contains('ck'))return;
  if(c.hasAttribute('data-ckall'))visIds.forEach(id=>c.checked?sel.add(id):sel.delete(id));else c.checked?sel.add(c.dataset.ck):sel.delete(c.dataset.ck);render()});
list.onclick=e=>{
  if(e.target.closest('[data-clearf]')){fStatus='all';fLoc.clear();fCat.clear();fTag.clear();render();return}
  const h=e.target.closest('[data-sort]');if(h){const k=h.dataset.sort;if(sortK===k)sortD=-sortD;else{sortK=k;sortD=1}remember();render();return}
  if(e.target.closest('.ckw'))return;
  const r=e.target.closest('[data-id]');if(!r)return;const it=S.items.find(x=>x.id===r.dataset.id);if(!it)return;
  if(lpFired){lpFired=false;return}
  if(sel.size&&r.classList.contains('card')){sel.has(it.id)?sel.delete(it.id):sel.add(it.id);render();return}
  const qb=e.target.closest('[data-q]');if(qb){it.qty=Math.max(0,(it.qty||0)+ +qb.dataset.q);save();render();return}
  if(e.target.closest('[data-act="fill"]'))return fillSheet(it);
  editSheet(it)};

/* geri tuşu: pencere açıksa kapat, seçim varsa kaldır, kategori seçiliyse Tümü'ye dön, ana ekrandaysa çık */
function goBack(){
  if(isOpen()){if(sheetBack&&sheetBack())return true;close();return true}
  if(sel.size){sel.clear();render();return true}
  if(view!=='Tümü'){view='Tümü';render();return true}
  return false;
}
if(APP){APP.addListener('backButton',()=>{if(!goBack())APP.exitApp()});APP.addListener('resume',()=>{render();autoBackup()})}

new ResizeObserver(()=>document.documentElement.style.setProperty('--hh',$('#hd').offsetHeight+'px')).observe($('#hd'));
{let lastY=scrollY,up=0,hold=0;const setC=v=>{if(document.body.classList.contains('compact')!==v){document.body.classList.toggle('compact',v);hold=Date.now()+320}};
  addEventListener('scroll',()=>{const y=scrollY,dy=y-lastY;lastY=y;if(Date.now()<hold)return;
    if(y<24){up=0;setC(false);return}
    if(dy>0){up=0;if(y>70)setC(true)}else{up+=dy;if(up<-40)setC(false)}},{passive:true})}
render();
if(isNative){
  (async()=>{try{if(!hadLocal&&PR){const r=await PR.get({key:KEY});if(r&&r.value){const d=JSON.parse(r.value);if(d&&Array.isArray(d.items)){S=migrate(d);try{localStorage.setItem(KEY,r.value)}catch(e){}render()}}}}catch(e){}
    store();
    try{await LN.requestPermissions()}catch(e){}
    scheduleNotes();autoBackup()})();
}
}
