name: APK derle

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Paketleri kur
        run: npm install

      - name: Android projesini oluştur
        run: |
          npx cap add android
          npx cap sync android

      - name: Simge ve açılış ekranı
        continue-on-error: true
        run: npx capacitor-assets generate --android --iconBackgroundColor '#303236' --splashBackgroundColor '#1f2022' --splashBackgroundColorDark '#1f2022'

      - name: Kendi ikon dosyalarımızı uygula
        run: cp -r res-overlay/* android/app/src/main/res/

      - name: Sabit imza ayarı (güncellemeler eskisinin üzerine kurulabilsin)
        run: |
          cat >> android/app/build.gradle <<'GRADLE'

          android {
              signingConfigs {
                  kiler {
                      storeFile file("${rootDir}/../keystore/debug.keystore")
                      storePassword "android"
                      keyAlias "androiddebugkey"
                      keyPassword "android"
                  }
              }
              buildTypes {
                  debug { signingConfig signingConfigs.kiler }
              }
          }
          GRADLE
          tail -16 android/app/build.gradle

      - name: Sürüm numarası
        run: |
          sed -i "s/versionCode [0-9]*/versionCode ${{ github.run_number }}/" android/app/build.gradle
          sed -i "s/versionName \"[^\"]*\"/versionName \"1.${{ github.run_number }}\"/" android/app/build.gradle
          grep -E "versionCode|versionName" android/app/build.gradle

      - name: Sabit imza anahtarı
        run: |
          mkdir -p ~/.android
          cp keystore/debug.keystore ~/.android/debug.keystore

      - name: APK derle
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: APK'yı adlandır
        run: cp android/app/build/outputs/apk/debug/app-debug.apk kiler-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: kiler-${{ github.run_number }}
          path: kiler-${{ github.run_number }}.apk

      - name: Release oluştur
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v1.${{ github.run_number }}
          name: Kiler 1.${{ github.run_number }}
          body: "Telefona kurmak için aşağıdaki kiler-${{ github.run_number }}.apk dosyasını indir."
          files: kiler-${{ github.run_number }}.apk
          make_latest: true
